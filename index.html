<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VideoBoost</title>
<style>
:root{--bg:#0b0b12;--card:#171721;--accent:#7c5cff;--text:#f5f5fa;--muted:#aaaabd;--danger:#ff5d73}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}.auth{min-height:100vh;display:grid;place-items:center;padding:24px}.auth-card{width:min(430px,100%);background:var(--card);padding:30px;border-radius:22px;box-shadow:0 20px 70px #0008}.logo{font-size:34px;font-weight:800;color:var(--accent)}.sub{color:var(--muted);margin:4px 0 24px}.field{margin:10px 0}.field label{display:block;color:var(--muted);margin-bottom:6px}.field input{width:100%;padding:13px 14px;border:1px solid #30303e;background:#101019;color:var(--text);border-radius:12px;outline:none}.primary{background:var(--accent);color:white;padding:13px 16px;border-radius:12px;width:100%;font-weight:700}.link{background:none;color:#b9aaff;padding:10px}.error{color:#ff8292;margin-top:12px}.app{display:flex;min-height:100vh}.side{width:240px;background:var(--card);padding:20px;position:fixed;inset:0 auto 0 0}.side .logo{font-size:25px;margin:8px 10px 25px}.nav button{display:block;width:100%;text-align:left;background:transparent;color:#c5c5d5;padding:13px 14px;border-radius:11px;margin:4px 0}.nav button.active,.nav button:hover{background:#252532;color:white}.main{margin-left:240px;width:calc(100% - 240px);padding:28px;max-width:1400px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.title{font-size:30px;font-weight:800}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:22px 0}.stat{background:var(--card);border-radius:18px;padding:20px}.stat b{font-size:28px;display:block;margin-top:8px}.panel{background:var(--card);border-radius:18px;padding:20px;margin-top:14px}.upload{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.primary.small{width:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px 8px;border-bottom:1px solid #292936;text-align:left}.badge{padding:5px 9px;border-radius:999px;background:#292936}.danger{background:var(--danger);color:white;padding:11px 14px;border-radius:10px}.mobile-nav{display:none}
@media(max-width:800px){.side{display:none}.main{margin:0;width:100%;padding:18px 16px 85px}.grid{grid-template-columns:1fr}.mobile-nav{display:flex;position:fixed;z-index:5;bottom:0;left:0;right:0;background:var(--card);padding:7px;gap:4px}.mobile-nav button{flex:1;background:none;color:#bbb;padding:10px 2px}.mobile-nav button.active{color:white;background:#252532;border-radius:10px}.top{align-items:flex-start}.title{font-size:25px}}
</style></head>
<body>
<section id="auth" class="auth"><div class="auth-card"><div class="logo">VideoBoost</div><div class="sub">Seu estúdio de vídeos em massa</div><form id="authForm"><div class="field"><label>E-mail</label><input id="email" type="email" required></div><div class="field"><label>Senha</label><input id="password" type="password" required></div><button class="primary" id="authBtn">Entrar</button></form><button class="link" id="toggleAuth">Criar nova conta</button><div class="field"><label>URL da API</label><input id="apiUrl" value="http://localhost:8000"></div><div id="authError" class="error"></div></div></section>
<section id="app" class="app hidden"><aside class="side"><div class="logo">VideoBoost</div><div class="nav" id="sideNav"></div></aside><main class="main"><div id="page"></div></main><nav class="mobile-nav" id="mobileNav"></nav></section>
<script>
const $=s=>document.querySelector(s);let register=false,token=localStorage.getItem('vb_token')||'',api=localStorage.getItem('vb_api')||'http://localhost:8000',page='home';$('#apiUrl').value=api;
const labels={home:'Dashboard',videos:'Vídeos',calendar:'Calendário',accounts:'Contas',settings:'Configurações'};
async function req(path,opt={}){let h=opt.headers||{};if(token)h.Authorization='Bearer '+token;let r=await fetch(api.replace(/\/$/,'')+path,{...opt,headers:h});if(!r.ok)throw Error((await r.text()).slice(0,200)||r.statusText);return r.headers.get('content-type')?.includes('json')?r.json():r.text()}
function nav(){let html=Object.entries(labels).map(([k,v])=>`<button class="${page===k?'active':''}" data-page="${k}">${v}</button>`).join('');$('#sideNav').innerHTML=html;$('#mobileNav').innerHTML=html;document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()})}
function stat(name,value){return `<div class="stat"><span class="muted">${name}</span><b>${value??'-'}</b></div>`}
async function render(){nav();let p=$('#page');p.innerHTML=`<div class="top"><div><div class="title">${labels[page]}</div><div class="muted">Central de operação</div></div><button class="danger" id="logout">Sair</button></div><div class="panel">Carregando...</div>`;$('#logout').onclick=logout;
try{if(page==='home')await dashboard(p);else if(page==='videos')await videos(p);else if(page==='settings')settings(p);else if(page==='calendar')placeholder(p,'As publicações agendadas aparecerão aqui quando o calendário estiver conectado à API.');else placeholder(p,'As conexões OAuth são configuradas pelo backend para Instagram, TikTok e YouTube.')}catch(e){p.querySelector('.panel').innerHTML=`<div class="error">${e.message}</div>`}}
async function dashboard(p){let o=await req('/api/operations/overview'),j=await req('/api/jobs');p.innerHTML=`<div class="top"><div><div class="title">Dashboard</div><div class="muted">Central de operação</div></div><button class="danger" id="logout">Sair</button></div><div class="grid">${stat('Vídeos processados',o.metrics?.videos_done)}${stat('Na fila',j.stats?.pending)}${stat('Publicações agendadas',o.metrics?.publications_scheduled)}</div><div class="panel"><b>Status da operação</b><p class="muted">Processando: ${j.stats?.running||0} · Concluídos: ${j.stats?.done||0} · Erros: ${j.stats?.errors||0}</p><button class="primary small" id="refresh">Atualizar</button></div>`;$('#logout').onclick=logout;$('#refresh').onclick=render}
async function videos(p){let j=await req('/api/jobs');p.innerHTML=`<div class="top"><div><div class="title">Vídeos</div><div class="muted">Biblioteca e processamento</div></div><button class="danger" id="logout">Sair</button></div><div class="panel"><div class="upload"><input id="files" type="file" accept="video/*" multiple><button class="primary small" id="upload">Enviar vídeos</button></div><div id="upmsg" class="muted"></div></div><div class="panel"><table class="table"><thead><tr><th>Arquivo</th><th>Status</th><th>Progresso</th></tr></thead><tbody>${(j.jobs||[]).map(x=>`<tr><td>${esc(x.filename)}</td><td><span class="badge">${esc(x.status)}</span></td><td>${x.progress||0}%</td></tr>`).join('')||'<tr><td colspan="3" class="muted">Nenhum vídeo.</td></tr>'}</tbody></table></div>`;$('#logout').onclick=logout;$('#upload').onclick=upload}
async function upload(){let fs=[...$('#files').files];if(!fs.length)return;let msg=$('#upmsg');msg.textContent='Enviando...';let fd=new FormData();fs.forEach(f=>fd.append('files',f));fd.append('format','vertical');fd.append('priority','normal');fd.append('text','');fd.append('text_position','bottom');fd.append('opacity','0.85');try{await req('/api/jobs',{method:'POST',body:fd});msg.textContent='Envio concluído.';setTimeout(render,600)}catch(e){msg.textContent='Erro: '+e.message}}
function settings(p){p.innerHTML=`<div class="top"><div><div class="title">Configurações</div><div class="muted">Conexão com o VideoBoost</div></div><button class="danger" id="logout">Sair</button></div><div class="panel"><div class="field"><label>URL da API</label><input id="apiEdit" value="${esc(api)}"></div><button class="primary small" id="save">Salvar conexão</button><p class="muted">A URL é salva apenas neste navegador.</p></div>`;$('#logout').onclick=logout;$('#save').onclick=()=>{api=$('#apiEdit').value.trim().replace(/\/$/,'');localStorage.setItem('vb_api',api);render()}}
function placeholder(p,t){p.querySelector('.panel').innerHTML=`<p class="muted">${t}</p>`}function esc(s=''){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
async function login(){localStorage.setItem('vb_api',api=$('#apiUrl').value.trim().replace(/\/$/,''));let fd=new FormData();fd.append('email',$('#email').value);fd.append('password',$('#password').value);try{let r=await req(register?'/api/auth/register':'/api/auth/login',{method:'POST',body:fd});token=r.token;localStorage.setItem('vb_token',token);$('#auth').classList.add('hidden');$('#app').classList.remove('hidden');render()}catch(e){$('#authError').textContent=e.message}}
function logout(){token='';localStorage.removeItem('vb_token');$('#app').classList.add('hidden');$('#auth').classList.remove('hidden')}
$('#authForm').onsubmit=e=>{e.preventDefault();login()};$('#toggleAuth').onclick=()=>{register=!register;$('#authBtn').textContent=register?'Criar conta':'Entrar';$('#toggleAuth').textContent=register?'Já tenho uma conta':'Criar nova conta'};
if(token){$('#auth').classList.add('hidden');$('#app').classList.remove('hidden');render()}
</script></body></html>
